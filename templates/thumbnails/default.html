<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280,height=720">
    <title>YouTube Thumbnail Template</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1280px;
            height: 720px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a237e 0%, #4a148c 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }
        .title {
            font-size: 64px;
            font-weight: 800;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
            margin: 40px;
            line-height: 1.2;
            max-width: 1100px;
        }
        .subtitle {
            font-size: 36px;
            font-weight: 600;
            opacity: 0.9;
            margin-top: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
        }
        .channel-brand {
            position: absolute;
            bottom: 40px;
            right: 40px;
            font-size: 32px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.8);
        }
        .accent {
            color: #ff4081;
        }
    </style>
</head>
<body>
    <div class="title">{{ title }}</div>
    {% if subtitle %}
    <div class="subtitle">{{ subtitle }}</div>
    {% endif %}
    <div class="channel-brand">{{ channel }}<span class="accent">▶</span></div>
</body>
</html>
