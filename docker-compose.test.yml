version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: animus-test-postgres
    environment:
      POSTGRES_USER: animus
      POSTGRES_PASSWORD: animus
      POSTGRES_DB: animus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animus"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: animus-test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: animus-test-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/animus-assets --ignore-existing;
      echo 'Bucket created';
      "

  animus:
    image: animus:latest
    container_name: animus-test-app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Pull in all host .env variables
    env_file:
      - .env
    environment:
      # Overrides for internal container networking
      - DATABASE_URL=postgres://animus:animus@postgres:5432/animus
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=animus-assets
      - S3_REGION=us-east-1
      # Explicitly ensure these are set correctly for the test
      - TTS_PROVIDER=${TTS_PROVIDER:-openai}
      - OPENAI_TTS_API_KEY=${OPENAI_TTS_API_KEY}
      # Test seed
      - SEED_TOPIC=The power of Stoic indifference in modern chaos
      - SOURCE_FOCUS=Stoicism
      - RUST_LOG=animus=debug,orichalcum=debug
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: on-failure
